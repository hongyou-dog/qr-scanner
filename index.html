<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code 分割畫面掃描器</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { margin: 0; display: flex; flex-direction: column; height: 100vh; position: relative; font-family: sans-serif; background: #000; }
    
    /* 修正 1：相機區域改用固定高度，確保足夠容納正方形的掃描框 */
    #reader { height: 350px; width: 100%; background: #000; color: white !important; overflow: hidden; position: relative; }
    #reader * { color: white !important; }
    
    #url-bar {
      background: #333; color: #fff; padding: 10px 15px; font-size: 14px; 
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 2px solid #555;
    }
    #scanned-url { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70%; color: #aaa; }
    #open-link {
      background: #4CAF50; color: white; padding: 6px 12px; border-radius: 4px; 
      text-decoration: none; font-weight: bold; font-size: 13px; display: none;
    }

    #browser { flex: 1; width: 100%; border: none; background: #f9f9f9; }
    
    #toast {
      position: absolute; top: 15%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(0, 180, 0, 0.9); color: white; padding: 12px 24px;
      border-radius: 8px; font-weight: bold; font-size: 18px;
      display: none; z-index: 10; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div id="toast">掃碼成功 OK</div>
  
  <!-- 掃描區塊 -->
  <div id="reader"></div>
  
  <div id="url-bar">
    <span id="scanned-url">等待掃描...</span>
    <a id="open-link" href="#" target="_blank">↗ 另開網頁</a>
  </div>

  <iframe id="browser" src="about:blank"></iframe>

  <script>
    let lastScannedUrl = "";
    let html5QrCode;

    function onScanSuccess(decodedText, decodedResult) {
      if(decodedText.startsWith('http://') || decodedText.startsWith('https://')) {
        if (decodedText !== lastScannedUrl) {
          lastScannedUrl = decodedText;
          
          const toast = document.getElementById('toast');
          toast.style.display = 'block';
          setTimeout(() => { toast.style.display = 'none'; }, 2000);
          
          document.getElementById('scanned-url').textContent = decodedText;
          document.getElementById('scanned-url').style.color = "#fff";
          const openLink = document.getElementById('open-link');
          openLink.href = decodedText;
          openLink.style.display = 'inline-block';

          document.getElementById('browser').src = decodedText;
        }
      }
    }
    
    html5QrCode = new Html5Qrcode("reader");

    // 修正 2：直接指定長寬像素，強制畫出一個絕對的正方形（250x250像素）
    // 放棄讓系統自己算，解決白框被壓成扁長方形的問題
    const config = { 
      fps: 10,
      qrbox: { width: 250, height: 250 }
    };
    
    html5QrCode.start(
      { facingMode: "environment" }, 
      config,
      onScanSuccess
    ).catch(err => {
      console.error("相機啟動錯誤", err);
    });
  </script>
</body>
</html>
