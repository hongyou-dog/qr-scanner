<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code 分割畫面掃描器</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { margin: 0; display: flex; flex-direction: column; height: 100vh; }
    #reader { flex: 1; width: 100%; background: #222; }
    #browser { flex: 1; width: 100%; border: none; border-top: 2px solid #ccc; }
  </style>
</head>
<body>
  <div id="reader"></div>
  <iframe id="browser" src="about:blank"></iframe>

  <script>
    function onScanSuccess(decodedText, decodedResult) {
      if(decodedText.startsWith('http://') || decodedText.startsWith('https://')) {
        document.getElementById('browser').src = decodedText;
      }
    }
    const html5QrcodeScanner = new Html5QrcodeScanner(
      "reader", { fps: 10, qrbox: { width: 250, height: 250 } }
    );
    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
